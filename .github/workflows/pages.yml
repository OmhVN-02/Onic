name: Publish Onic Wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate YAML reference data
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync } from 'node:fs';
          import { resolve, relative } from 'node:path';
          const root = process.cwd();
          function collect(product) {
            const directory = resolve(root, 'assets/examples', product);
            function walk(path) {
              return readdirSync(path, {withFileTypes:true}).flatMap(entry => {
                const full = resolve(path, entry.name);
                return entry.isDirectory() ? walk(full) : full.endsWith('.yml') ? [{path:relative(directory,full).replaceAll('\\','/'),content:readFileSync(full,'utf8')}] : [];
              });
            }
            return walk(directory);
          }
          const shop = collect('solarshop'), shards = collect('solarshards'), tpa = collect('solartpa'), bounty = collect('solarbounty');
          const output = `window.ONIC_CONFIGS=${JSON.stringify(shop)};\nwindow.ONIC_SHARDS_CONFIG=${JSON.stringify(shards.find(f=>f.path==='config.yml').content)};\nwindow.ONIC_TPA_CONFIGS=${JSON.stringify(tpa)};\nwindow.ONIC_BOUNTY_CONFIGS=${JSON.stringify(bounty)};\n`;
          writeFileSync(resolve(root,'assets/config-data.js'),output);
          console.log(`Generated config data: ${shop.length} SolarShop, ${shards.length} SolarShards, ${tpa.length} SolarTPA templates.`);
          NODE
      - name: Validate wiki pages and assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { runInNewContext, Script } from 'node:vm';
          const root = process.cwd();
          const read = path => readFileSync(resolve(root, path), 'utf8');
          const sandbox = {window: {},URL};
          const source = read('assets/docs.js');
          new Script(source); new Script(read('assets/app.js')); new Script(read('assets/loading.js'));
          runInNewContext(source, sandbox);
          runInNewContext(read('assets/config-data.js'), sandbox);
          runInNewContext(read('assets/wiki.js'), sandbox);
          runInNewContext(read('assets/products.js'), sandbox);
          runInNewContext(read('assets/english.js'), sandbox);
          runInNewContext(read('assets/releases.js'), sandbox);
          runInNewContext(read('assets/bounty.js'), sandbox);
          runInNewContext(read('assets/placeholders.js'), sandbox);
          runInNewContext(read('assets/quest.js'), sandbox);
          runInNewContext(read('assets/beginner.js'), sandbox);
          runInNewContext(read('assets/rtp-config-data.js'), sandbox);
          runInNewContext(read('assets/rtp.js'), sandbox);
          runInNewContext(read('assets/catalog.js') + '\n' + read('assets/worth.js') + '\n' + read('assets/product-groups.js') + '\n' + read('assets/studio.js') + '\n' + read('assets/onickits-config-data.js') + '\n' + read('assets/onickits.js') + '\n' + read('assets/rtpzone-config-data.js') + '\n' + read('assets/rtpzone.js') + '\n' + read('assets/zone-updates.js') + '\n' + read('assets/worth-config-data.js') + '\n' + read('assets/worth-guide.js') + '\n' + read('assets/order-config-data.js') + '\n' + read('assets/order-guide.js') + '\n' + read('assets/order-releases.js') + '\n' + read('assets/duels-config-data.js') + '\n' + read('assets/duels-guide.js') + '\n' + read('assets/product-links.js'), sandbox);
          for (const localized of [sandbox.window.SOLAR_DOCS, sandbox.window.ONIC_ENGLISH]) {
            if (!localized.find(d=>d.id==='wiki').html.includes('href="#solarrtp-home"')) throw Error('SolarRTP product card missing');
            if (localized.filter(d=>d.product==='solarrtp').length !== 5) throw Error('SolarRTP guides missing');
            if (!localized.find(d=>d.id==='solarrtp-home').html.includes('assets/images/solarrtp/demo.gif')) throw Error('SolarRTP demo missing');
            if (!localized.find(d=>d.id==='solarrtp-changelog').html.includes('DevLog Plugins #141')) throw Error('SolarRTP devlog missing');
          }
          for (const localized of [sandbox.window.SOLAR_DOCS, sandbox.window.ONIC_ENGLISH]) {
            const home = localized.find(doc=>doc.id==='wiki');
            const api = localized.find(doc=>doc.id==='solarshards-api');
            if (!api || !api.html.includes('SolarShardsProvider') || !api.html.includes('getShardsAsync')) throw Error('SolarShards API documentation missing');
            if (!localized.find(doc=>doc.id==='solarshards-home').html.includes('href="#solarshards-api"')) throw Error('SolarShards API entry missing');
            for (const product of sandbox.window.ONIC_PLUGINS.filter(item=>item.status==='planned' && item.image).map(item=>item.id)) {
              if (!home.html.includes('href="#'+product+'-home"')) throw Error('Upcoming product card missing: '+product);
              const page = localized.find(doc=>doc.id===product+'-home');
              if (!page || !page.html.includes('assets/images/'+product+'.png')) throw Error('Upcoming product logo missing: '+product);
            }
            const rtp = localized.find(doc=>doc.id==='solarrtp-home');
            const headings = [...rtp.html.matchAll(/<h2[^>]*>([^<]+)<\/h2>/g)].map(match=>match[1]);
            if (headings.some(heading=>heading.length>24)) throw Error('SolarRTP section title too long');
          }
          for (const localized of [sandbox.window.SOLAR_DOCS, sandbox.window.ONIC_ENGLISH]) {
            const worth = localized.find(doc=>doc.id==='solarworth-changelog');
            if (!worth || ![146,140,224].every(number=>worth.html.includes('DevLog Plugins #'+number))) throw Error('SolarWorth devlogs missing');
            if (!(worth.html.indexOf('#146')<worth.html.indexOf('#140') && worth.html.indexOf('#140')<worth.html.indexOf('#224'))) throw Error('SolarWorth release date order incorrect');
            for (const item of ['SULFUR','POTENT_SULFUR','SULFUR_SPIKE','SULFUR_CUBE_BUCKET']) if (!worth.html.includes(item)) throw Error('Sulfur price missing');
            const home = localized.find(doc=>doc.id==='wiki');
            if (/class="card planned" href="#solarworth-home"/.test(home.html)) throw Error('SolarWorth still marked planned');
            if (!localized.find(doc=>doc.id==='solarshards-home').html.includes('<div class="cards"><a class="card" href="#solarshards-api"')) throw Error('API card grid missing');
          }
          const fresh = sandbox.window.ONIC_IS_NEW;
          const stamp = Date.parse('2026-11-09');
          if (!fresh({updatedAt:'2026-11-09'},stamp) || fresh({updatedAt:'2026-11-09'},stamp+7*86400000) || fresh({updatedAt:'2026-11-09'},stamp-1) || fresh({},stamp)) throw Error('NEW badge expiry incorrect');
          for (const localized of [sandbox.window.SOLAR_DOCS, sandbox.window.ONIC_ENGLISH]) {
            const home=localized.find(doc=>doc.id==='wiki');
            if (home.html.includes('id="lo-trinh"') || home.html.includes('Follow this order')) throw Error('Reading order still visible');
            for(const group of ['solar','onic','other','beta']) if(!home.html.includes('id="products-'+group+'"')) throw Error('Missing product group: '+group);
            for(const id of ['scombat','onicsus','onickits','crystalguard','antintr','solarauctionhouse','oniccore']) if(!home.html.includes('href="#'+id+'-home"') || !localized.some(doc=>doc.id===id+'-home')) throw Error('Missing product: '+id);
          }
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            if(!localized.some(doc=>doc.id==='contributors') || !localized.some(doc=>doc.id==='license')) throw Error('Studio pages missing');
          }
          if(read('index.html').indexOf('id="search"')>read('index.html').indexOf('id="plugin-picker"')) throw Error('Product picker must be below search');
          if(read('assets/app.js').includes('<h2 id="contributors">')) throw Error('Credits still embedded on homepage');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            const shop=localized.find(doc=>doc.id==='solarshop-changelog');
            for(const number of [74,122,121]) if(!shop.html.includes('DevLog Plugins #'+number)) throw Error('Missing SolarShop historical devlog: '+number);
            for(const value of ['adjust-buttons','LIME_STAINED_GLASS_PANE','RED_STAINED_GLASS_PANE','1/4/8','1/12/24','1/16/32','1/10/64','1/0/0']) if(!shop.html.includes(value)) throw Error('Missing adjustment configuration: '+value);
          }
          if(read('assets/app.js').includes('Cấu hình SolarShop') || !read('assets/app.js').includes('Xem tài liệu')) throw Error('Homepage CTA selection incorrect');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            const license=localized.find(doc=>doc.id==='license');
            for(const product of ['SolarRTP','SolarTPA','SolarBounty','SolarCrate','SolarAuctionHouse','AntiNTR','CrystalGuard','SolarTools','SolarElo']) if(!license.html.includes(product)) throw Error('License product missing: '+product);
            if(!license.html.includes('id="license-free"') || !license.html.includes('SolarElo-GPL-3.0.txt')) throw Error('Free/Open Source license section missing');
          }
          for(const file of ['assets/licenses/LICENSE.md','assets/licenses/LICENSE_VI.md']) {
            const list=read(file).split('SolarCore / SolarQuest')[1].split('\n')[0];
            if(/\b(?:SolarCrate|SolarRTP|SolarTPA|SolarBounty|SolarTools|SolarElo)\b/.test(list)) throw Error('Free/Open Source product in commercial license scope');
          }
          const javaSample='import example.API;\nif (api == null) return;\nString value = "<script>&";\napi.add(100L);';
          const javaHtml=runInNewContext('highlightJava('+JSON.stringify(javaSample)+')',sandbox);
          for(const kind of ['keyword','type','literal','string','number','function']) if(!javaHtml.includes('syntax-'+kind)) throw Error('Missing Java token color: '+kind);
          if(javaHtml.includes('<script>')) throw Error('Java highlighting does not escape HTML');
          const unmark=html=>html.replace(/<span class="syntax-[^"]+">|<\/span>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
          if(unmark(javaHtml)!==javaSample) throw Error('Java highlighting changes copyable content');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            if(!localized.find(doc=>doc.id==='solarshards-api').html.includes('syntax-keyword')) throw Error('SolarShards API not highlighted');
            if(!localized.find(doc=>doc.id==='solartpa-api').html.includes('syntax-type')) throw Error('SolarTPA API not highlighted');
          }
          if(sandbox.window.ONIC_KITS_CONFIGS.length!==9) throw Error('OnicKits YAML files missing');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            if(localized.filter(doc=>doc.product==='onickits').length!==6) throw Error('OnicKits guides missing');
            const menu=localized.find(doc=>doc.id==='onickits-menus');
            if((menu.html.match(/<img /g)||[]).length!==4) throw Error('OnicKits screenshots missing');
            const command=localized.find(doc=>doc.id==='onickits-commands');
            for(const value of ['/kitadmin savepremadekit','/kitadmin reload','kits.kit_command','kits.premium','kits.admin']) if(!command.html.includes(value)) throw Error('OnicKits command/permission missing: '+value);
            const config=localized.find(doc=>doc.id==='onickits-config');
            if(!config.lead.includes('OnicKits')) throw Error('OnicKits branding missing');
            const overview=localized.find(doc=>doc.id==='onickits-home');
            for(const value of ['hero-art product-hero onickits-hero','id="lo-trinh"','id="tinh-nang"','id="anh-gui"']) if(!overview.html.includes(value)) throw Error('OnicKits overview section missing: '+value);
            if(localized.filter(doc=>doc.product==='onickits').some(doc=>JSON.stringify(doc).includes('EthanKit'))) throw Error('Old OnicKits brand in documentation');
          }
          if(sandbox.window.ONIC_PLUGINS.find(product=>product.id==='onickits').status==='planned') throw Error('OnicKits still marked planned');
          if(sandbox.window.ONIC_ZONE_CONFIGS.length!==13) throw Error('SolarRTPZone sample files missing');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            if(localized.filter(doc=>doc.product==='solarrtpzone').length!==8) throw Error('SolarRTPZone guides missing');
            const commands=localized.find(doc=>doc.id==='solarrtpzone-commands').html;
            for(const value of ['/rtpq join','/rtpq leave','/rtpq zone set','/rtpq zone countdown','solarrtpzone.use','solarrtpzone.admin']) if(!commands.includes(value)) throw Error('SolarRTPZone command missing: '+value);
            const papi=localized.find(doc=>doc.id==='solarrtpzone-papi').html;
            for(const value of ['%solarrtpzone_currently%','%solarrtpzone_zone_name%','%solarrtpzone_zone_queue_spawn%']) if(!papi.includes(value)) throw Error('SolarRTPZone placeholder missing: '+value);
            if(localized.find(doc=>doc.id==='solarrtpzone-home').html.includes('Coming soon')) throw Error('SolarRTPZone still placeholder');
          }
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            const log=localized.find(doc=>doc.id==='solarrtpzone-changelog');
            const numbers=[208,207,206,202,184];
            for(const number of numbers) if(!log.html.includes('DevLog Plugins #'+number)) throw Error('SolarRTPZone devlog missing: '+number);
            for(let i=1;i<numbers.length;i++) if(log.html.indexOf('id="devlog-'+numbers[i-1]+'"')>=log.html.indexOf('id="devlog-'+numbers[i]+'"')) throw Error('SolarRTPZone release ordering incorrect');
            if((localized.find(doc=>doc.id==='solarrtpzone-menus').html.match(/<img /g)||[]).length!==15) throw Error('SolarRTPZone screenshots missing');
            for(const stamp of ['2026-08-03','2026-07-30','2026-07-19']) if(!log.html.includes(stamp)) throw Error('SolarRTPZone release date missing');
            if(!log.html.includes('&lt;zoneName&gt;') || !log.html.includes('&amp;#DDFF00&amp;l')) throw Error('Devlog code/color escaping incorrect');
          }
          const shared=sandbox.window.ONIC_PRODUCT_LINK('https://omhvn-02.github.io/Onic/?lang=vi#solarrtpzone-home','solarrtpzone','solarrtpzone-home');
          if(shared!=='https://omhvn-02.github.io/Onic/solarrtpzone.html?lang=vi#solarrtpzone-home') throw Error('Product share URL incorrect');
          if(sandbox.window.ONIC_PRODUCT_LINK(shared,undefined,'wiki')!=='https://omhvn-02.github.io/Onic/?lang=vi#wiki') throw Error('Home navigation from product URL incorrect');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            const home=localized.find(doc=>doc.id==='solarrtpzone-home').html;
            if(!home.includes('class="hero-shot"') || !home.includes('id="lo-trinh"') || home.indexOf('id="tinh-nang"')>home.indexOf('id="su-dung"')) throw Error('SolarRTPZone overview layout incorrect');
          }
          if(sandbox.window.ONIC_WORTH_CONFIGS.length!==20) throw Error('SolarWorth YAML samples missing');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            if(localized.filter(doc=>doc.product==='solarworth').length!==9) throw Error('SolarWorth guides missing');
            const menus=localized.find(doc=>doc.id==='solarworth-menus').html;
            if((menus.match(/<img /g)||[]).length!==13) throw Error('SolarWorth screenshots missing');
            if(!localized.find(doc=>doc.id==='solarworth-changelog').html.includes('DevLog Plugins #72')) throw Error('SolarWorth devlog 72 missing');
            if(!localized.find(doc=>doc.id==='solarrtpzone-changelog').html.includes('DevLog Plugins #75')) throw Error('SolarRTPZone devlog 75 missing');
            if(!localized.find(doc=>doc.id==='solarshards-home').html.includes('assets/images/solarshards/balance-example.png')) throw Error('Shards balance screenshot missing');
            if(!localized.find(doc=>doc.id==='solarworth-commands').html.includes('/selltool give')) throw Error('Current Sell Tool command missing');
          }
          if(sandbox.window.ONIC_ORDER_CONFIGS.length!==21) throw Error('SolarOrder YAML samples missing');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            if(localized.filter(doc=>doc.product==='solarorder').length!==8) throw Error('SolarOrder guides missing');
            if((localized.find(doc=>doc.id==='solarorder-menus').html.match(/<img /g)||[]).length!==12) throw Error('SolarOrder screenshots missing');
            if(!localized.find(doc=>doc.id==='wiki').html.includes('href="#solarorder-home"')) throw Error('SolarOrder product card missing');
            const lore=localized.find(doc=>doc.id==='solarworth-lore').html;
            for(const value of ['show_worth_lore','worth_lore_shulker','${price}','OCHRE_FROGLIGHT','3.0','item-value-lore.png']) if(!lore.includes(value)) throw Error('SolarWorth lore guide missing: '+value);
          }
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            const log=localized.find(doc=>doc.id==='solarorder-changelog');
            const numbers=[239,210,205,203,200,195,188,181];
            for(const number of numbers) if(!log.html.includes('DevLog Plugins #'+number)) throw Error('SolarOrder devlog missing: '+number);
            for(let i=1;i<numbers.length;i++) if(log.html.indexOf('id="devlog-'+numbers[i-1]+'"')>=log.html.indexOf('id="devlog-'+numbers[i]+'"')) throw Error('SolarOrder devlog date order incorrect');
            for(const value of ['duration.expiration','so_contributions','so_owner_collected','custom_amount','forceCloseGUISync','100k','1.5m']) if(!log.html.includes(value)) throw Error('SolarOrder release detail missing: '+value);
            if(!localized.find(doc=>doc.id==='solarorder-home').html.includes('href="#solarorder-changelog"')) throw Error('SolarOrder changelog link missing');
          }
          if(sandbox.window.ONIC_DUELS_CONFIGS.length!==8) throw Error('SolarDuels YAML files missing');
          for(const localized of [sandbox.window.SOLAR_DOCS,sandbox.window.ONIC_ENGLISH]) {
            if(localized.filter(doc=>doc.product==='solarduels').length!==8) throw Error('SolarDuels guides missing');
            if((localized.find(doc=>doc.id==='solarduels-menus').html.match(/<img /g)||[]).length!==3) throw Error('SolarDuels screenshots missing');
            const api=localized.find(doc=>doc.id==='solarduels-api').html;
            for(const value of ['org.OmhVN.api.SolarDuelsAPI','getInstance','getPlayerStats','savePlayerStats','isInDuel','getActiveDuel','isInQueue','getQueueWaitTime','isSpectating','getTopPlayers','DuelStartEvent','DuelEndEvent','PlayerJoinQueueEvent','PlayerLeaveQueueEvent','IllegalStateException']) if(!api.includes(value)) throw Error('SolarDuels API detail missing: '+value);
            if(!api.includes('syntax-keyword')) throw Error('SolarDuels API coloring missing');
          }
          if(sandbox.window.ONIC_PLUGINS.find(p=>p.id==='solarduels').status==='planned') throw Error('SolarDuels still marked planned');
          const productIds = sandbox.window.ONIC_PLUGINS.map(product=>product.id);
          if (new Set(productIds).size!==productIds.length) throw Error('Duplicate product registry entry');
          const docs = sandbox.window.SOLAR_DOCS;
          const ids = new Set();
          function assert(condition, text) { if (!condition) throw Error(text); }
          for (const unavailable of [false,true]) {
            const root = {dataset:{}};
            let click, saved = 'dark', pressed;
            const button = {setAttribute: (_,value) => { pressed=value; },addEventListener: (_,handler) => { click=handler; }};
            const localStorage = {
              getItem(){ if(unavailable) throw Error('Storage unavailable'); return saved; },
              setItem(_,value){ if(unavailable) throw Error('Storage unavailable'); saved=value; }
            };
            runInNewContext(read('assets/theme.js'), {document:{documentElement:root,getElementById:()=>button,querySelector:()=>null},localStorage});
            click(); assert(root.dataset.theme==='light' && pressed==='true', 'Theme must switch to light');
            click(); assert(root.dataset.theme==='dark' && pressed==='false', 'Theme must switch back to dark');
          }
          const visibleDocs = [...docs, ...sandbox.window.ONIC_ENGLISH];
          assert(!/\bno[\s-]?key\b/i.test(JSON.stringify([visibleDocs, sandbox.window.ONIC_PLUGINS, read('index.html')])), 'Internal edition label in public wiki');
          for (const doc of docs) {
            assert(!ids.has(doc.id), 'Duplicate article: ' + doc.id); ids.add(doc.id);
            assert(doc.title && doc.lead && doc.html, 'Incomplete article: ' + doc.id);
            const sections = [...doc.html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
            assert(new Set(sections).size === sections.length, 'Duplicate section: ' + doc.id);
          }
          for (const doc of docs) for (const [,id] of doc.html.matchAll(/href="#([^"/]+)"/g)) assert(ids.has(id) || ids.has(sandbox.window.ONIC_MOVED_GUIDES[id]), 'Broken article link: ' + id);
          for (const doc of docs) for (const [,asset] of doc.html.matchAll(/(?:src|href)="(assets\/[^"?#]+)"/g)) assert(existsSync(resolve(root, asset)), 'Missing asset: ' + asset);
          assert(docs.filter(d=>d.product==='solartpa').length === 7, 'Missing SolarTPA documentation');
          for (const localeDocs of [docs,sandbox.window.ONIC_ENGLISH]) {
            const html = localeDocs.find(d=>d.id==='solartpa-home')?.html || '';
            assert((html.match(/<img\b[^>]*src="assets\/images\/solartpa\//g)||[]).length === 10, 'Missing SolarTPA screenshots');
          }
          assert(docs.find(d=>d.id==='solarshop-changelog')?.html.includes('DevLog Plugins #156'), 'Missing SolarShop release notes');
          assert(docs.find(d=>d.id==='solartpa-changelog')?.html.includes('DevLog Plugins #157'), 'Missing SolarTPA release notes');
          assert(docs.find(d=>d.id==='solartpa-changelog')?.html.includes('DevLog Plugins #155'), 'Missing SolarTPA EssentialsX update');
          for (const [oldId,parentId] of Object.entries(sandbox.window.ONIC_MOVED_GUIDES)) {
            assert(!ids.has(oldId) && docs.find(d=>d.id===parentId)?.html.includes('id="'+oldId+'"'), 'Guide not merged: '+oldId);
          }
          assert(sandbox.window.ONIC_TPA_CONFIGS.length === 8, 'Missing SolarTPA YAML templates');
          assert((docs.find(d=>d.id==='bat-dau').html.match(/<img\b[^>]*src="assets\/images\/solarshop\//g)||[]).length === 8, 'Missing SolarShop demo, hero or gallery screenshots');
          assert(runInNewContext('highlightYaml("key: true # note")',sandbox).includes('yaml-literal'), 'YAML highlighting missing');
          assert(!runInNewContext('highlightYaml(' + JSON.stringify('name: "<script>"') + ')',sandbox).includes('<script>'), 'YAML highlighting must escape HTML');
          assert(sandbox.window.ONIC_ENGLISH.length === docs.length, 'Missing English guides');
          for (const [i,doc] of sandbox.window.ONIC_ENGLISH.entries()) {
            assert(doc.id === docs[i].id && doc.html && doc.title && doc.lead, 'Missing English content: ' + docs[i].id);
            for (const [,asset] of doc.html.matchAll(/(?:src|href)="(assets\/[^"?#]+)"/g)) assert(existsSync(resolve(root,asset)), 'Missing English asset: ' + asset);
          }
          for (const doc of docs) for (const [,article,section] of doc.html.matchAll(/href="#([^"/]+)\/([^"]+)"/g)) {
            const target = docs.find(d => d.id === article);
            assert(target && target.html.includes('id="' + section + '"'), 'Broken section link: ' + article + '/' + section);
          }
          assert(runInNewContext('keyRows("messages:\\n  chat-messages: false")[1][0]',sandbox).includes('messages.chat-messages'), 'Nested key paths must be complete');
          assert(runInNewContext('keyRows("command-aliases:\\n  - shop")[0][0]',sandbox).includes('command-aliases'), 'List key must be indexed');
          assert(docs[0].id === 'wiki', 'Default page must be multi-product wiki');
          assert(docs.some(d=>d.id==='solarshop-config') && docs.some(d=>d.id==='solarshards-config'), 'Missing config references');
          for (const [,asset] of read('index.html').matchAll(/(?:src|href)="(assets\/[^"?#]+)"/g)) assert(existsSync(resolve(root, asset)), 'Missing asset: ' + asset);
          assert(!/https?:\/\/localhost|C:\\Users|THAY_BANG_MAT_KHAU_RIENG.*THAT/.test(source), 'Unexpected local/private reference');
          console.log(`PASS: ${docs.length} articles, JS syntax, unique routes/sections and local links/assets.`);
          NODE
      - uses: actions/configure-pages@v5
      - name: Assemble public files only
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R assets _site/
          node .github/scripts/build-product-pages.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
