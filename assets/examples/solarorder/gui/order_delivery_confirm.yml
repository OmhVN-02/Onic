title: "ᴄᴏɴғɪʀᴍ ᴅᴇʟɪᴠᴇʀʏ"

items:
  delivery_order:
    name: "#00BFFFᴏʀᴅᴇʀ ʙʏ {playerName}"
    lore:
      - "#00BFFF{itemAmount} &f{itemType}"
      - "#00BFFF{itemPrice} &fᴍỗɪ ᴄáɪ"
      - ""
      - "&7Bạn đang giao #00BFFF{deliveryAmount} &f{itemType}"
    material: "BARRIER"
    slot: 13
    sound: click

  cancel:
    name: "#ff3c3cᴄᴀɴᴄᴇʟ"
    lore:
      - "&fNhấp để quay lại"
    material: "RED_STAINED_GLASS_PANE"
    slot: 10
    customModelData: -1
    sound: click

  confirm:
    name: "#00ff3cᴄᴏɴꜰɪʀᴍ"
    lore:
      - "&fNhấp để giao vật phẩm"
      - "&7(+{moneyForDelivery})"
    material: "LIME_STAINED_GLASS_PANE"
    slot: 16
    customModelData: -1
    sound: click


