#  SOLAR CRATE  |  TIẾNG VIỆT
#  Tin nhắn hỗ trợ màu MiniMessage và {prefix}. Để trống tin nhắn để tắt.

messages:
  #  01  |  TIỀN TỐ
  prefix: "<#C8AE79>ѕᴏʟᴀʀᴄʀᴀᴛᴇ <#626D78>› <#D4D9DF>"
  
  #  02  |  THÔNG BÁO CHUNG
  no-permission: "{prefix}<#D89B93>Bạn không đủ quyền hạn để thực hiện thao tác này!"
  reload-success: "{prefix}<#A9C8AC>Đã tải lại toàn bộ cấu hình plugin thành công!"
  player-not-found: "{prefix}<#D89B93>Không tìm thấy người chơi yêu cầu!"
  console-specify-player: "{prefix}<#D89B93>Lệnh từ Console bắt buộc phải chỉ định tên người chơi!"
  
  #  03  |  PHIÊN BẢN
  version-info: "{prefix}<#B8C1CA>Phiên bản <#C8AE79>v{version}</#C8AE79> phát triển bởi <#00BFFF>{author}</#00BFFF>."
  
  #  04  |  QUẢN LÝ CRATE
  crate-not-exists: "{prefix}<#D89B93>Hòm đồ <#C8AE79>'{crate}'</#C8AE79> không tồn tại trong hệ thống!"
  crate-already-exists: "{prefix}<#D89B93>Hòm đồ <#C8AE79>'{crate}'</#C8AE79> đã tồn tại từ trước!"
  crate-created: "{prefix}<#A9C8AC>Tạo mới hòm đồ <#C8AE79>'{crate}'</#C8AE79> thành công!"
  crate-deleted: "{prefix}<#A9C8AC>Đã xóa hòm đồ <#C8AE79>'{crate}'</#C8AE79> thành công!"
  
  #  05  |  CÚ PHÁP & KIỂM TRA ĐẦU VÀO
  open-usage: "{prefix}<#D89B93>Cú pháp: /sc open <tên_crate>"
  edit-usage: "{prefix}<#D89B93>Cú pháp: /sca edit [tên_crate]"
  give-key-usage: "{prefix}<#D89B93>Cú pháp: /sca give <tên_crate> <số_lượng> [người_chơi/*]"
  givekeyitem-usage: "{prefix}<#D89B93>Cú pháp: /sca givekeyitem <tên_crate> <số_lượng> [người_chơi/*]"
  take-key-usage: "{prefix}<#D89B93>Cú pháp: /sca take <tên_crate> <số_lượng|all> <người_chơi>"
  setkey-usage: "{prefix}<#D89B93>Cú pháp: /sca setkey <tên_crate> <số_lượng> <người_chơi>"
  keyall-usage: "{prefix}<#D89B93>Cú pháp: /sca keyall <tên_crate> <số_lượng>"
  addcrate-usage: "{prefix}<#D89B93>Cú pháp: /sca addcrate <tên_crate>"
  setblock-usage: "{prefix}<#D89B93>Cú pháp: /sca setblock <tên_crate>"
  removeblock-usage: "{prefix}<#D89B93>Cú pháp: /sca removeblock <tên_crate>"
  teleport-usage: "{prefix}<#D89B93>Cú pháp: /sca tp <tên_crate>"
  create-usage: "{prefix}<#D89B93>Cú pháp: /sca create <tên_crate> [tên_hiển_thị]"
  delete-usage: "{prefix}<#D89B93>Cú pháp: /sca delete <tên_crate>"
  deletekey-usage: "{prefix}<#D89B93>Cú pháp: /sca deletekey <tên_crate> <người_chơi>"
  setdisplayname-usage: "{prefix}<#D89B93>Cú pháp: /sca setdisplayname <tên_crate> <tên_hiển_thị>"
  
  invalid-crate-name: "{prefix}<#D89B93>Tên hòm đồ không hợp lệ! Chỉ dùng chữ cái, số và dấu gạch ngang/dưới."
  invalid-key-amount: "{prefix}<#D89B93>Số lượng chìa khóa không hợp lệ!"
  amount-must-be-number: "{prefix}<#D89B93>Số lượng phải là một số nguyên dương hợp lệ!"
  
  #  06  |  CHÌA KHÓA & PHẦN THƯỞNG
  gave-keys: "{prefix}<#B8C1CA>Đã gửi <#FFC469>{amount}x</#FFC469> chìa khóa <#C8AE79>{crate}</#C8AE79> cho người chơi <#A9C8AC>{player}</#A9C8AC>."
  took-keys: "{prefix}<#B8C1CA>Đã thu hồi <#FFC469>{amount}x</#FFC469> chìa khóa <#C8AE79>{crate}</#C8AE79> từ người chơi <#A9C8AC>{player}</#A9C8AC>."
  gave-keys-to-all: "{prefix}<#B8C1CA>Đã xếp lịch phát <#FFC469>{amount}x</#FFC469> chìa khóa <#C8AE79>{crate}</#C8AE79> cho <#A9C8AC>{count}</#A9C8AC> người chơi online!"
  key-received-message: "{prefix}<#B8C1CA>Bạn vừa nhận được <#FFC469>{amount}x</#FFC469> chìa khóa <#C8AE79>{crate}</#C8AE79>!"
  not-enough-keys: "{prefix}<#D89B93>Bạn không có đủ chìa khóa để thực hiện thao tác này!"
  no-key-for-crate: "{prefix}<#D89B93>Bạn cần có ít nhất <#FFC469>{keys}x</#FFC469> chìa khóa để mở hòm này!"
  inventory-full-no-reward: "{prefix}<#C8AE79>Túi đồ đã đầy! Phần thưởng đã rơi xuống đất xung quanh bạn."
  
  #  07  |  KHỐI CRATE & VỊ TRÍ
  addcrate-hold-item: "{prefix}<#D89B93>Bạn phải cầm khối block cần gán Crate trên tay chính!"
  addcrate-item-name: "<gradient:#00F986:#00BFFF>[Crate: {name}]</gradient>"
  addcrate-received: "{prefix}<#A9C8AC>Đã tạo khối gán Crate <#C8AE79>{name}</#C8AE79>! Hãy đặt khối này xuống đất để xác định vị trí hòm."
  addcrate-placed: "{prefix}<#A9C8AC>Đã thiết lập vị trí Crate <#C8AE79>{name}</#C8AE79> tại tọa độ <#FFC469>{x}, {y}, {z}</#FFC469>!"

config-version: "${project.version}"
