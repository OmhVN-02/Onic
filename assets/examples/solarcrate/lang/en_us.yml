#  SOLAR CRATE  |  ENGLISH
#  Messages support MiniMessage and {prefix}. Use an empty message to disable it.

messages:
  #  01  |  PREFIX
  prefix: "<#C8AE79>ѕᴏʟᴀʀᴄʀᴀᴛᴇ <#626D78>› <#D4D9DF>"
  
  #  02  |  GENERAL
  no-permission: "{prefix}<#D89B93>You do not have permission to perform this action!"
  reload-success: "{prefix}<#A9C8AC>All plugin configurations have been reloaded successfully!"
  player-not-found: "{prefix}<#D89B93>Player not found!"
  console-specify-player: "{prefix}<#D89B93>You must specify a target player when executing from console!"
  
  #  03  |  VERSION
  version-info: "{prefix}<#B8C1CA>Running <#C8AE79>v{version}</#C8AE79> developed by <#00BFFF>{author}</#00BFFF>."
  
  #  04  |  CRATE MANAGEMENT
  crate-not-exists: "{prefix}<#D89B93>Crate <#C8AE79>'{crate}'</#C8AE79> does not exist!"
  crate-already-exists: "{prefix}<#D89B93>Crate <#C8AE79>'{crate}'</#C8AE79> already exists!"
  crate-created: "{prefix}<#A9C8AC>Successfully created crate <#C8AE79>'{crate}'</#C8AE79>!"
  crate-deleted: "{prefix}<#A9C8AC>Successfully deleted crate <#C8AE79>'{crate}'</#C8AE79>!"
  
  #  05  |  COMMAND USAGE & VALIDATION
  open-usage: "{prefix}<#D89B93>Usage: /sc open <crate_name>"
  edit-usage: "{prefix}<#D89B93>Usage: /sca edit [crate_name]"
  give-key-usage: "{prefix}<#D89B93>Usage: /sca give <crate_name> <amount> [player/*]"
  givekeyitem-usage: "{prefix}<#D89B93>Usage: /sca givekeyitem <crate_name> <amount> [player/*]"
  take-key-usage: "{prefix}<#D89B93>Usage: /sca take <crate_name> <amount|all> <player>"
  setkey-usage: "{prefix}<#D89B93>Usage: /sca setkey <crate_name> <amount> <player>"
  keyall-usage: "{prefix}<#D89B93>Usage: /sca keyall <crate_name> <amount>"
  addcrate-usage: "{prefix}<#D89B93>Usage: /sca addcrate <crate_name>"
  setblock-usage: "{prefix}<#D89B93>Usage: /sca setblock <crate_name>"
  removeblock-usage: "{prefix}<#D89B93>Usage: /sca removeblock <crate_name>"
  teleport-usage: "{prefix}<#D89B93>Usage: /sca tp <crate_name>"
  create-usage: "{prefix}<#D89B93>Usage: /sca create <crate_name> [display_name]"
  delete-usage: "{prefix}<#D89B93>Usage: /sca delete <crate_name>"
  deletekey-usage: "{prefix}<#D89B93>Usage: /sca deletekey <crate_name> <player>"
  setdisplayname-usage: "{prefix}<#D89B93>Usage: /sca setdisplayname <crate_name> <display_name>"
  
  invalid-crate-name: "{prefix}<#D89B93>Invalid crate name! Only letters, numbers, and underscores are allowed."
  invalid-key-amount: "{prefix}<#D89B93>Invalid key amount specified!"
  amount-must-be-number: "{prefix}<#D89B93>Key amount must be a positive integer!"
  
  #  06  |  KEYS & REWARDS
  gave-keys: "{prefix}<#B8C1CA>Gave <#FFC469>{amount}x</#FFC469> <#C8AE79>{crate}</#C8AE79> key(s) to <#A9C8AC>{player}</#A9C8AC>."
  took-keys: "{prefix}<#B8C1CA>Took <#FFC469>{amount}x</#FFC469> <#C8AE79>{crate}</#C8AE79> key(s) from <#A9C8AC>{player}</#A9C8AC>."
  gave-keys-to-all: "{prefix}<#B8C1CA>Queued <#FFC469>{amount}x</#FFC469> <#C8AE79>{crate}</#C8AE79> key(s) for <#A9C8AC>{count}</#A9C8AC> online players!"
  key-received-message: "{prefix}<#B8C1CA>You received <#FFC469>{amount}x</#FFC469> <#C8AE79>{crate}</#C8AE79> key(s)!"
  not-enough-keys: "{prefix}<#D89B93>You do not have enough keys to open this crate!"
  no-key-for-crate: "{prefix}<#D89B93>You need at least <#FFC469>{keys}x</#FFC469> key(s) to open this crate!"
  inventory-full-no-reward: "{prefix}<#C8AE79>Your inventory was full! Reward dropped on the ground near you."
  
  #  07  |  CRATE BLOCKS & LOCATIONS
  addcrate-hold-item: "{prefix}<#D89B93>You must hold the target crate block in your main hand!"
  addcrate-item-name: "<gradient:#00F986:#00BFFF>[Crate: {name}]</gradient>"
  addcrate-received: "{prefix}<#A9C8AC>Created crate placement block for <#C8AE79>{name}</#C8AE79>! Place it on the ground to set the crate location."
  addcrate-placed: "{prefix}<#A9C8AC>Successfully set crate location for <#C8AE79>{name}</#C8AE79> at <#FFC469>{x}, {y}, {z}</#FFC469>!"

config-version: "${project.version}"
