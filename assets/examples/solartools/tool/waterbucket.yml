# ── Cấu hình hiển thị & thuộc tính của WaterBucket ────────────────────────
material: WATER_BUCKET # Có thể đổi sang item khác; chức năng đặt nước vẫn được giữ nguyên
display-name: "&x&a&5&0&3&f&cᴀᴍᴇᴛʜʏѕᴛ ᴡᴀᴛᴇʀ ʙᴜᴄᴋᴇᴛ"
enchantment-text: "§7Đặt nước xa tối đa 27 khối"
duration: 4320

# Chế độ hết hạn: "time" (theo thời gian) hoặc "uses" (theo số lần sử dụng)
expiration-mode: time
# Số lần sử dụng tối đa (chỉ áp dụng khi expiration-mode = uses)
max-uses: 500

enchantments:
  unbreaking: 3
  mending: 1
  aqua_affinity: 1

# Âm thanh khi sử dụng tool; hỗ trợ tên Bukkit hoặc khóa minecraft:/resource pack.
sound:
  enabled: true
  name: ITEM_BUCKET_EMPTY
  volume: 1.0
  pitch: 1.0
