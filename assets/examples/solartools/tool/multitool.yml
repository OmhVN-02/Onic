# ── Cấu hình hiển thị & thuộc tính của MultiTool ──────────────────────────
material: NETHERITE_PICKAXE # Item ban đầu; tier này tự áp dụng cho các dạng AXE/SHOVEL/HOE
# Tùy chọn: bỏ dấu # để đặt material riêng cho từng dạng của MultiTool.
# form-materials:
#   pickaxe: NETHERITE_PICKAXE
#   axe: NETHERITE_AXE
#   shovel: NETHERITE_SHOVEL
#   hoe: NETHERITE_HOE
display-name: "&x&a&5&0&3&f&cᴀᴍᴇᴛʜʏѕᴛ ᴍᴜʟᴛɪᴛᴏᴏʟ"
enchantment-text: "§74 Dụng cụ trong một vật phẩm!"
duration: 10080
size: 3 # Có thể dùng 1x3, 2x3, 3x3

# Chế độ hết hạn: "time" (theo thời gian) hoặc "uses" (theo số lần sử dụng)
expiration-mode: time
# Số lần sử dụng tối đa (chỉ áp dụng khi expiration-mode = uses)
max-uses: 1000

enchantments:
  efficiency: 5
  unbreaking: 3
  mending: 1
  fortune: 3
  silk_touch: 1

breakable-blocks: []

# Âm thanh khi sử dụng tool; hỗ trợ tên Bukkit hoặc khóa minecraft:/resource pack.
sound:
  enabled: true
  name: BLOCK_AMETHYST_BLOCK_CHIME
  volume: 1.0
  pitch: 1.0
