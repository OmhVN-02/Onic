# ─────────────────────────────────────────────
#   SolarWorth: Danh mục Khối
#   (Blocks Category)
# ─────────────────────────────────────────────
# Định nghĩa icon, yêu cầu tiến trình và danh
# sách vật phẩm cho danh mục Blocks.
# Defines the category icon, progress milestones,
# and sellable item list for Blocks.
#
# Cấu trúc chính / Top-level structure:
#   Vị trí nút được quyết định bởi token (id) trong ma trận GUI.
#   Button positions are controlled by (id) tokens in the GUI matrix.
#   material    → loại block/item làm icon
#                 Icon material
#   title       → tên hiển thị trên nút
#                 Display name on the button
#   lore        → mô tả hiển thị khi hover
#                 Lore shown on hover
# ─────────────────────────────────────────────

# Trang chính
material: BRICK
title: '#00F986ᴋʜốɪ'
lore:
- '&7Bán các khối để'
- '&7nâng cấp hệ số bán hàng!'
- ''
- '&7Tiến trình đến &f{nextProgress}'
- '&f{progressBar}{progressBarCompletedPercentage}'

# ─────────────────────────────────────────────
#   Màn hình tiến trình nâng cấp multiplier
#   Multiplier upgrade progress screen
# ─────────────────────────────────────────────
#   layout    → bố cục GUI dùng ký tự đặc biệt:
#               GUI layout using special chars:
#                 -  = slot filler (kính xám)
#                 c  = icon danh mục / category icon
#                 b  = nút quay lại / back button
#                 (N)= slot cấp độ N / level-N slot
#   requirements → danh sách mốc cấp độ:
#                  Upgrade milestones:
#                    multiplier → hệ số nhân mới / new multiplier
#                    price      → tiền tích lũy cần đạt / required sell total
#   items     → giao diện các ô tiến trình:
#               Progress slot appearances:
#                 filler   → slot trống / empty slot
#                 c        → icon danh mục / category icon
#                 p.current  → cấp đang làm / in-progress level
#                 p.complete → cấp đã xong / completed level
#                 p.incomplete→ cấp chưa tới / locked level
#                 back     → nút quay lại / back button
# ─────────────────────────────────────────────
progress:
  title: ᴛɪếɴ ᴛʀɪ̀ɴʜ ᴋʜốɪ
  layout:
  - -c-----(20)-
  - -(1)-(9)(10)(11)-(19)-
  - -(2)-(8)-(12)-(18)-
  - -(3)-(7)-(13)-(17)-
  - -(4)(5)(6)-(14)(15)(16)-
  - b--------
  requirements:
    '1':
      multiplier: 1.1
      price: 25000
    '2':
      multiplier: 1.2
      price: 150000
    '3':
      multiplier: 1.3
      price: 500000
    '4':
      multiplier: 1.4
      price: 1000000
    '5':
      multiplier: 1.5
      price: 5000000
    '6':
      multiplier: 1.6
      price: 25000000
    '7':
      multiplier: 1.7
      price: 250000000
    '8':
      multiplier: 1.8
      price: 550000000
    '9':
      multiplier: 1.9
      price: 850000000
    '10':
      multiplier: 2.0
      price: 1000000000
    '11':
      multiplier: 2.1
      price: 2000000000
    '12':
      multiplier: 2.2
      price: 4000000000
    '13':
      multiplier: 2.3
      price: 8000000000
    '14':
      multiplier: 2.4
      price: 10000000000
    '15':
      multiplier: 2.5
      price: 20000000000
    '16':
      multiplier: 2.6
      price: 40000000000
    '17':
      multiplier: 2.7
      price: 80000000000
    '18':
      multiplier: 2.8
      price: 160000000000
    '19':
      multiplier: 2.9
      price: 320000000000
    '20':
      multiplier: 3.0
      price: 640000000000
  
  items:
    filler:
      material: GRAY_STAINED_GLASS_PANE
      title: ''
      lore:
      - ''
    c:
      material: BRICK
      title: '#00F986ᴋʜốɪ'
      lore:
      - '&7Bán các khối để'
      - '&7nâng cấp hệ số bán hàng!'
      - ''
      - '&fXem tiến trình bên dưới'
    p:
      current:
        material: YELLOW_STAINED_GLASS_PANE
        title: '#FCE300Đᴀɴɢ ᴛʜựᴄ ʜɪệɴ'
        lore:
        - '&f{progressBar} &f{multiplier} {progressBarCompletedPercentage}'
        - '&7{currentProgressMoney}/{targetProgressMoney}'
      complete:
        material: LIME_STAINED_GLASS_PANE
        title: '#00F986ʜᴏàɴ ᴛʜàɴʜ'
        lore:
        - '&f{progressBar} &f{multiplier} {progressBarCompletedPercentage}'
        - '&7{currentProgressMoney}/{targetProgressMoney}'
      incomplete:
        material: WHITE_STAINED_GLASS_PANE
        title: '&fᴄʜưᴀ ʜᴏàɴ ᴛʜàɴʜ'
        lore:
        - '&f{progressBar} &f{multiplier} {progressBarCompletedPercentage}'
        - '&7{currentProgressMoney}/{targetProgressMoney}'
    back:
      material: RED_STAINED_GLASS_PANE
      title: '#FC0000ǫᴜᴀʏ ʟạɪ'
      lore:
      - '&fNhấn để quay lại'

# ─────────────────────────────────────────────
#   Catalogue — danh sách item bán được
#   Catalogue — list of sellable items
# ─────────────────────────────────────────────
#   back       → nút quay lại màn hình trước
#                Back button to previous screen
#   navigation → phân trang (next/back)
#                Pagination buttons (next/back)
#   items.lore → lore hiển thị trên mỗi item
#                Lore shown on each item in catalog
#   items.list → danh sách Material ID Minecraft
#                List of Minecraft Material IDs
