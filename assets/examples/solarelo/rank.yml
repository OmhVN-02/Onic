# SolarElo Rank Configuration (Cấu hình Cấp Bậc SolarElo)

# Ranks are ordered from lowest to highest by min-elo (Ranks được sắp xếp từ thấp đến cao theo min-elo)
# rankup-commands: Commands executed when player promotes to this rank (Lệnh chạy khi player lên rank, dùng {player})
# reward-description: The public reward lines displayed in the Rank Rewards menu.
#                     These lines are separate from commands, so commands are never exposed to players.
#                     (Mô tả phần thưởng hiện cho người chơi xem, mỗi dòng là một mục.)
ranks:
  lt5:
    display: "#aaaaaaLT5"
    min-elo: 0
    prefix: "#aaaaaa[LT5]"
    rankup-commands: []
    reward-description: []

  ht5:
    display: "#777777HT5"
    min-elo: 1000
    prefix: "#777777[HT5]"
    rankup-commands: []
    reward-description: []

