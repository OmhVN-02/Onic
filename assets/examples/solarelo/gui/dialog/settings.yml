inputs:
  chat:
    enabled: true
  title:
    enabled: true
  bounty:
    enabled: true
buttons:
  chat-toggle:
    label: "#00BFFFᴄʜᴀᴛ ɴᴏᴛɪꜰɪᴄᴀᴛɪᴏɴ #aaaaaa• {status}"
    description: "Toggle ELO notifications in chat."
