  title-toggle:
    label: "#ff3c3cᴛɪᴛʟᴇ ɴᴏᴛɪꜰɪᴄᴀᴛɪᴏɴ #aaaaaa• {status}"
    description: "Toggle ELO change titles on screen."
    width: 240
  bounty-toggle:
    label: "#ffaa00ʙᴏᴜɴᴛʏ ɴᴏᴛɪꜰɪᴄᴀᴛɪᴏɴ #aaaaaa• {status}"
    description: "Toggle bounty notifications."
    width: 240
  back:
    label: "ʙᴀᴄᴋ"
    description: "Return to the main menu."
    width: 240
config-version: "1.10"
