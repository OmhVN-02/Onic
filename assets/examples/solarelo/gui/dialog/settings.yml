title: "#ffaa00sᴇᴛᴛɪɴɢs"
body: "#aaaaaaᴘʟᴀʏᴇʀ: #ffffff{player}"
no-settings: "#aaaaaaɴᴏ sᴇᴛᴛɪɴɢs ᴀᴠᴀɪʟᴀʙʟᴇ"
status:
  enabled: "#55ff55ᴏɴ"
  disabled: "#ff5555ᴏꜰꜰ"
