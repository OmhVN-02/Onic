# SpawnStash: cấu trúc mồi tạm thời để phát hiện X-Ray/ESP.
# Tệp cấu hình này nằm tại modules/spawn-stash.yml.
#
# HƯỚNG DẪN NHANH:
# - Dùng /spawnstash để tạo ngẫu nhiên hoặc /spawnstash <loại> để chọn mẫu.
# - Mỗi mẫu trong "types" là tập hợp block theo offset [x, y, z] tính từ vị trí đặt.
# - ttl_seconds là thời gian tồn tại; khi hết hạn, block cũ được khôi phục tự động.
# - Toàn bộ câu thông báo nằm tại messages.yml -> messages.spawnstash.
# - Sau khi chỉnh file, dùng /solarcore reload.
settings:
  enabled: true
  default_ttl_seconds: 900
  default_alert_radius: 8.0
  alert_cooldown_seconds: 30
  check_interval_ticks: 20
  overwrite_blocks: true
  protect_blocks: false
  claim_spawners_on_break: false
  rollback_on_reload: true
  log_to_console: true
  max_blocks_per_stash: 256

types:
  '1':
    enabled: true
    display_name: '&dKho thạch anh tím nhỏ'
    ttl_seconds: 900
    alert_radius: 8.0
    paste_offset: 0, 0, 0
    blocks:
      - offset: -1, 0, 0
        material: DEEPSLATE
      - offset: 0, 0, 0
        material: SPAWNER
        spawner_type: SKELETON
        spawner_access: PUBLIC
      - offset: 1, 0, 0
        material: DEEPSLATE
      - offset: -1, 0, 1
        material: COBBLED_DEEPSLATE
      - offset: 0, 0, 1
        material: AMETHYST_BLOCK
      - offset: 1, 0, 1
        material: COBBLED_DEEPSLATE
      - offset: -1, 1, 0
        material: DEEPSLATE_TILES
      - offset: 1, 1, 0
        material: DEEPSLATE_TILES
      - offset: -1, 1, 1
        material: DEEPSLATE
      - offset: 0, 1, 1
        material: BUDDING_AMETHYST
      - offset: 1, 1, 1
        material: DEEPSLATE
      - offset: 0, 2, 1
        material: AMETHYST_CLUSTER
      - offset: -1, 2, 1
        material: POLISHED_DEEPSLATE
      - offset: 1, 2, 1
