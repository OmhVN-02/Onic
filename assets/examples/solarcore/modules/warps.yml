# Tùy chỉnh Warps (Warp Configuration)
warp:
  # Bật / tắt tính năng Warp (true = bật, false = tắt hoàn toàn và nhả lệnh cho plugin khác)
  # Enable / disable Warp module (true = enable, false = disable and release command to fallback plugins)
  enabled: true

  # Thời gian đếm ngược khi dịch chuyển đến Warp (giây)
  # Countdown before teleporting to warp (seconds)
  teleport-countdown: 5
